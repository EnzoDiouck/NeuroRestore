services:
  jupyter:
    build:
      context: .
      dockerfile: jupyter_docker/Dockerfile
    container_name: tensorflow_jupyter
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - JUPYTER_PWD=
      - JUPYTER_PORT=8888
    ports:
      - "8888:8888"
    volumes:
      - ./models:/app/models
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - jupyter_network

networks:
  jupyter_network:
    driver: bridge