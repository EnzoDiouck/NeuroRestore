services:
  backend:
    build: ./app/backend
    container_name: image_reconstructor_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    container_name: image_reconstructor_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./app/frontend:/app
    depends_on:
      - backend
    restart: unless-stopped
